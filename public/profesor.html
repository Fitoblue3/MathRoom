<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathRoom - Panel del Profesor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="script.js" defer></script>
</head>
    <body>
        <header class="header">
            <button class="btn volver" onclick="window.location.href='index.html'">
            <span class="material-symbols-outlined">arrow_back</span> Volver</button>
            <h1 class="title title-in">Math <span>Room</span></h1>
            <img class="img-logo" src="images/Logo.svg" alt="Logo">
        </header>
        <main class="profesor-container">

            <section class="top-bar">
                <button class="btn btn-qr-access" id="btnAbrirQr">
                    <span class="icon material-symbols-outlined">qr_code_2</span> 
                    Mostrar QR y Código de Sala
                </button>
                <button class="btn btn-lista-est" id="btnAbrirLista">
                    <span class="icon material-symbols-outlined">patient_list</span>
                    Mostrar lista de estudiantes
                </button>
            </section>

            <section>
                <h2><span class="icon material-symbols-outlined">edit_square</span> Nueva Pregunta</h2>
                <div class="form-group">
                    <label for="pregunta">Ejercicio / Operación</label>
                    <input type="text" id="pregunta" placeholder="Ej: 7 + 10">
                </div>
            

                <div class="form-group">
                    <label for="respuesta">Respuesta Correcta</label>
                    <input type="text" id="respuesta" placeholder="Ej: 17">
                </div>

                <button class="btn profesor-btn">Lanzar Pregunta<span class="icon material-symbols-outlined">arrow_outward</span></button>
            </section>

            <section class="card-section respuestas-section">
                <h2><span class="material-symbols-outlined">monitoring</span> Respuestas en Tiempo Real</h2>
                
                <div class="respuestas-grid">
                    <!-- Respuesta correcta -->
                    <div class="respuesta-card correcto">
                        <span class="nombre">Pedro</span>
                        <span class="estado-badge"><span class="material-symbols-outlined">check_circle</span> Correcto</span>
                    </div>

                    <!-- Respuesta incorrecta -->
                    <div class="respuesta-card incorrecto">
                        <span class="nombre">María</span>
                        <span class="estado-badge"><span class="material-symbols-outlined">cancel</span> Incorrecto</span>
                    </div>
                </div>
            </section>
        </main>

        <div class="modal-overlay" id="modalQr">
            <div class="modal-card">
                <h2>¡Únete a la Sala!</h2>
                <p>Escanea el código QR o ingresa el PIN:</p>
                
                <div class="qr-box-large">
                    <!-- Aquí dibujaremos el QR dinámico más adelante -->
                
                    <span class="material-symbols-outlined qr-placeholder-large">qr_code_2</span>
                </div>

                <div class="pin-container">
                    <span class="pin-label">CÓDIGO PIN:</span>
                    <span class="pin-code" id="codigoPin">849 201</span>
                </div>

                <p class="modal-tip">Haz clic fuera de este recuadro para cerrar</p>
            </div>
        </div>
        
    </body>
</html>
